<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>비평웹진 공통감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#000000;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper);overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
::selection{background:var(--ink);color:var(--paper)}

header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--ink);z-index:5}
header.bare{border-bottom-color:transparent}
.bar{max-width:1120px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;gap:12px;background:#fff}
.logo-word{font-family:var(--serif);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;white-space:nowrap}
.logo svg{display:block;width:112px;height:24px}
.menubtn{position:relative;background:none;border:0;color:var(--ink);font:500 .92rem var(--sans);cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 0}
.menubtn i{display:block;width:26px;height:10px;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor}

#menu{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
#menu.open{opacity:1;visibility:visible;transition:opacity .25s ease}
#menu .top{max-width:1120px;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
#menu nav{max-width:1120px;width:100%;margin:auto;display:flex;flex-direction:column;gap:4px}
#menu nav a{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,7vw,4rem);line-height:1.3;width:fit-content;border-bottom:2px solid transparent}
#menu nav a:hover,#menu nav a.on{border-bottom-color:var(--ink)}

main{width:100%;max-width:1120px;min-width:0;margin:0 auto;padding:40px 24px 80px}
body.home main{display:none}
body.home footer{position:fixed;left:0;right:0;bottom:0;border-top-color:transparent;z-index:4}

.cat{font-size:.8rem;font-weight:600}
.meta{font-size:.84rem}
.pagehead{margin:0 0 20px;padding-bottom:18px;border-bottom:1px solid var(--ink)}
.pagehead h1{font-family:var(--serif);font-size:2rem;margin:0 0 6px}
.pagehead p{margin:0}

.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--ink)}
.list a{display:grid;grid-template-columns:90px 1fr 150px;gap:24px;padding:22px 0;align-items:baseline}
.list a:hover h4{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.list h4{margin:0 0 4px;font-family:var(--serif);font-size:1.18rem;font-weight:600;line-height:1.45}
.list .sub{margin:0;font-size:.92rem;font-weight:400}
.list .meta{text-align:right}

article.post-page{display:block;width:min(100%,680px)!important;max-width:680px!important;min-width:0;margin-left:auto!important;margin-right:auto!important;overflow-wrap:anywhere}
article h1{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.35;margin:12px 0 14px;letter-spacing:-.015em}
article .lede{font-family:var(--serif);font-size:1.08rem;margin:0 0 26px;line-height:1.8}
article .byline{padding:14px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-bottom:34px;display:flex;justify-content:space-between}
article .byline a{border-bottom:1px solid var(--ink)}
article .body{display:block;width:100%!important;max-width:100%!important;min-width:0;overflow-wrap:anywhere!important;word-break:normal!important}
article .body>*{max-width:100%!important;min-width:0}
article .body p,article .body span,article .body a,article .body li{white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important}
article .body p{font-family:var(--serif);font-size:1.06rem;line-height:1.95;margin:0 0 1.3em;text-align:justify;text-justify:inter-character;text-align-last:left}
article .body h2,article .body h3{font-family:var(--serif);line-height:1.5;margin:2em 0 .8em}
article .body h2{font-size:1.45rem}article .body h3{font-size:1.2rem}
article .body blockquote{font-family:var(--serif);margin:1.8em 0;padding:4px 0 4px 20px;border-left:3px solid var(--ink);line-height:1.9}
article .body ul,article .body ol{font-family:var(--serif);line-height:1.9;padding-left:1.6em;margin:0 0 1.3em}
article .body a{border-bottom:1px solid currentColor}
article .body img{display:block;width:auto!important;max-width:100%!important;height:auto!important;margin:2em auto;object-fit:contain!important;filter:none!important}
article .body .ql-align-center{text-align:center;text-align-last:center}
article .body .ql-align-right{text-align:right;text-align-last:right}
article .body .ql-align-left{text-align:left;text-align-last:left}
article .body .ql-align-justify{text-align:justify;text-align-last:left}
.post-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:34px 0}
.post-gallery figure{margin:0}
.post-gallery img{display:block;width:auto!important;max-width:100%!important;height:auto!important;margin:0 auto;border:1px solid var(--ink);object-fit:contain!important;filter:none!important}
.back{display:inline-block;margin-top:40px;font-size:.9rem;border-bottom:1px solid var(--ink)}
.tempnote{border:1px solid var(--ink);padding:10px 14px;font-size:.85rem;margin-bottom:30px}

.writers{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.writers a{display:flex;flex-direction:column;gap:10px;padding:26px 22px 22px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-height:210px}
.writers a:hover{background:var(--ink);color:var(--paper)}
.writers-login{display:block;width:fit-content;margin:14px 0 0 auto;font-size:.78rem;border-bottom:1px solid var(--ink)}
.writers h3{margin:0;font-family:var(--serif);font-size:1.5rem;font-weight:700}
.writers p{margin:0;font-family:var(--serif);font-size:.95rem;line-height:1.7;word-break:keep-all;flex:1}
.initial{width:56px;height:56px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1.4rem;font-weight:600}

.profile{display:grid;grid-template-columns:140px 1fr;gap:32px;padding-bottom:30px;border-bottom:1px solid var(--ink);margin-bottom:10px}
.profile .initial{width:120px;height:120px;font-size:3rem}
.profile h1{font-family:var(--serif);font-size:2.2rem;margin:0 0 4px}
.profile .field{font-size:.9rem;margin:0 0 16px}
.profile p.bio{font-family:var(--serif);line-height:1.9;margin:0;max-width:60ch;word-break:keep-all}
.histhead{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 0;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.histhead h2{margin:0;font-size:1rem;font-weight:600}

.about{max-width:680px}
.about p{font-family:var(--serif);line-height:1.95;word-break:keep-all}
.about dl{display:grid;grid-template-columns:120px 1fr;gap:10px 20px;margin-top:30px;font-size:.95rem}
.about dd{margin:0}

/* issues */
.covers{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 28px}
.cover{display:block}
.cover .sheet{aspect-ratio:3/4;border:1px solid var(--ink);position:relative;overflow:hidden;background:var(--paper)}
.cover .sheet svg{position:absolute;inset:0;width:100%;height:100%}
.cover .mast{position:absolute;left:0;right:0;top:0;padding:16px 18px;display:flex;justify-content:space-between;align-items:baseline;background:var(--paper);border-bottom:1px solid var(--ink)}
.cover .mast b{font-family:var(--serif);font-size:1.3rem}
.cover .mast span{font-size:.8rem}
.cover .no{position:absolute;left:18px;bottom:14px;font-family:var(--serif);font-weight:700;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1;background:var(--paper);padding:6px 10px 8px;border:1px solid var(--ink)}
.cover h3{margin:14px 0 2px;font-family:var(--serif);font-size:1.2rem}
.cover p{margin:0;font-size:.88rem}
.cover:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

.issuehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;align-items:start}
.tiles.masonry{grid-auto-rows:8px;grid-auto-flow:dense;column-gap:28px;row-gap:0}
.tiles.masonry>.tile{display:block;min-width:0;margin-bottom:28px;grid-row-end:span 1}
.tile{display:block}
.tile .img{position:relative;width:fit-content;max-width:100%;margin-left:auto;margin-right:auto;overflow:visible;border:0;background:transparent}
.tile .img svg{position:absolute;inset:0;width:100%;height:100%}
.tile .img>img{position:static!important;display:block;width:auto!important;max-width:100%!important;height:auto!important;margin:0 auto;border:0!important;background:transparent!important;object-fit:contain!important;filter:none!important}
.tile .cap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;gap:10px;opacity:0;transition:opacity .35s ease}
.tile .cap h4{margin:0;font-family:var(--serif);font-size:1.25rem;line-height:1.4;font-weight:700;word-break:keep-all;background:var(--paper);padding:2px 8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tile .cap span{font-size:.85rem;background:var(--paper);padding:1px 8px}
.tile .below{display:none;margin-top:10px}
.tile .below.no-image{display:block;margin-top:0;padding:18px;border:1px solid var(--ink);min-height:120px}
.tile .below h4{margin:0;font-family:var(--serif);font-size:1.05rem}
.tile .below span{font-size:.84rem}
@media (hover:hover){
  .tiles .tile:hover .cap,.tiles .tile:focus-visible .cap{opacity:1}
}
@media (hover:none){.tile .below{display:block}}

footer{border-top:1px solid var(--ink)}
footer .bar{font-size:.8rem}

/* editor */
.editor{max-width:960px;margin:0 auto}
.editor-login{max-width:460px;margin:40px auto;border:1px solid var(--ink);padding:28px}
.editor-login h1,.editor h1,.editor h2{font-family:var(--serif)}
.editor-note{border:1px solid var(--ink);padding:12px 14px;margin:0 0 24px;font-size:.88rem}
.editor-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:32px;align-items:start}
.editor-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--ink);margin:0 0 34px}
.editor-nav a{display:flex;min-height:58px;align-items:center;justify-content:center;padding:12px 8px;text-align:center;font-weight:600;font-size:.88rem;border-right:1px solid var(--ink)}
.editor-nav a:last-child{border-right:0}
.editor-nav a:hover,.editor-nav a:focus-visible,.editor-nav a.on{background:var(--ink);color:var(--paper)}
.editor-home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.editor-home-card{display:flex;min-height:160px;border:1px solid var(--ink);padding:24px;flex-direction:column;justify-content:space-between}
.editor-home-card h2{margin:0;font-size:1.35rem}
.editor-home-card p{margin:24px 0 0;font-size:.86rem;line-height:1.7}
.editor-home-card:hover,.editor-home-card:focus-visible{background:var(--ink);color:var(--paper)}
.editor-section{max-width:760px}
.editor-panel{border-top:1px solid var(--ink);padding-top:18px;margin-bottom:34px}
.editor-panel h2{font-size:1.25rem;margin:0 0 16px}
.editor label{display:block;font-size:.82rem;font-weight:600;margin:0 0 12px}
.editor input,.editor textarea,.editor select,.editor button{width:100%;border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:inherit;padding:9px 10px}
.editor input[type="checkbox"]{width:auto;padding:0}
.editor textarea{min-height:110px;resize:vertical;line-height:1.65}
.editor button{cursor:pointer;font-weight:600}
.editor button.primary{background:var(--ink);color:var(--paper)}
.editor button.inline,.editor a.inline{width:auto;display:inline-block;padding:6px 10px;font-size:.82rem;border:1px solid var(--ink);margin-right:6px}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.editor-actions>*{flex:1}
.editor-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.editor-list li{padding:14px 0;border-bottom:1px solid var(--ink)}
.editor-list h3{font-family:var(--serif);font-size:1rem;margin:0 0 4px}
.editor-list p{font-size:.82rem;margin:0 0 9px}
.editor-mini{border:1px solid var(--ink);padding:14px;margin-bottom:12px}
.editor-mini h3{font-family:var(--serif);font-size:1.05rem;margin:0 0 10px}
.editor-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.editor-top h1{margin:0}
.status{min-height:1.5em;font-size:.85rem;margin-top:8px}
.danger{color:#8a0000}
.footer-editor{border-bottom:1px solid currentColor}
.upload-help{display:block;margin:-5px 0 12px;font-size:.78rem;font-weight:400}
.upload-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.upload-grid label{margin:0;border:1px solid var(--ink);padding:8px;font-weight:400}
.upload-grid img{display:block;width:auto;max-width:100%;height:auto;object-fit:contain;margin:0 auto 7px;filter:none}
.upload-grid span{display:flex;align-items:center;gap:6px;font-size:.76rem}
.editor-field{margin:0 0 14px}
.editor-field-label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
.quill-wrap{background:var(--paper)}
.quill-wrap .ql-toolbar.ql-snow,.quill-wrap .ql-container.ql-snow{border-color:var(--ink);border-radius:0}
.quill-wrap .ql-toolbar.ql-snow{font-family:var(--sans);padding:7px}
.quill-wrap .ql-container.ql-snow{font-family:var(--serif);font-size:1rem;min-height:340px}
.quill-wrap .ql-editor{min-height:340px;line-height:1.85;max-width:100%;overflow-wrap:anywhere;word-break:normal}
.quill-wrap .ql-editor p{margin:0 0 1em}
.quill-wrap .ql-editor img{max-width:100%;height:auto}
.editor .ql-toolbar button{width:28px;border:0;padding:3px 5px;background:transparent}
.editor .ql-toolbar button:hover,.editor .ql-toolbar button.ql-active{background:#eee;color:var(--ink)}
.editor .ql-toolbar .ql-picker{font:inherit}
.editor .ql-toolbar select{width:auto;border:0;padding:0}
.editor-uploading{opacity:.65;pointer-events:none}

@media (max-width:860px){.writers,.covers,.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .list a{grid-template-columns:1fr;gap:4px}
  .list .meta{text-align:left}
  .profile{grid-template-columns:1fr;gap:18px}
  .profile .initial{width:84px;height:84px;font-size:2.2rem}
  .editor-grid{grid-template-columns:1fr}
  .editor-nav{grid-template-columns:repeat(2,1fr)}
  .editor-nav a:nth-child(2){border-right:0}
  .editor-nav a:nth-child(-n+2){border-bottom:1px solid var(--ink)}
  .editor-home-grid{grid-template-columns:1fr}
}
@media (max-width:520px){.writers,.tiles{grid-template-columns:1fr}.writers a{min-height:0}.covers{gap:28px 16px}}
@media (max-width:520px){.post-gallery{grid-template-columns:1fr}.upload-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){#menu,#menu.open,.tile .img svg,.tile .cap{transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#/" aria-label="공통감 처음으로">
      <span class="logo-word">공통감</span>
      <svg viewBox="0 0 500 105" role="img" aria-label="공통감 로고"><rect width="500" height="105" fill="#fff"/><g fill="none" stroke="#000" stroke-linecap="round"><path d="M18 86 L466 86" stroke-width="7"/><path d="M18 81 L466 20" stroke-width="7"/><path d="M454 80 L468 62" stroke-width="3"/><g stroke-width="2.5"><path d="M76 73 L66 83"/><path d="M101 70 L89 84"/><path d="M126 67 L113 84"/><path d="M151 63 L137 84"/><path d="M176 60 L161 84"/><path d="M201 56 L185 84"/><path d="M226 53 L209 84"/><path d="M251 50 L233 84"/><path d="M276 46 L257 84"/><path d="M301 43 L281 84"/><path d="M326 39 L305 84"/><path d="M351 36 L329 84"/><path d="M376 33 L353 84"/><path d="M401 29 L377 84"/><path d="M426 26 L401 84"/><path d="M451 22 L425 84"/></g></g></svg>
    </a>
    <button class="menubtn" id="openMenu" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menu"><i></i></button>
  </div>
</header>

<div id="menu" role="dialog" aria-modal="true" aria-label="메뉴">
  <div class="top">
    <a class="logo" href="#/" aria-label="공통감 처음으로">
      <span class="logo-word">공통감</span>
      <svg viewBox="0 0 500 105" role="img" aria-label="공통감 로고"><rect width="500" height="105" fill="#fff"/><g fill="none" stroke="#000" stroke-linecap="round"><path d="M18 86 L466 86" stroke-width="7"/><path d="M18 81 L466 20" stroke-width="7"/><path d="M454 80 L468 62" stroke-width="3"/><g stroke-width="2.5"><path d="M76 73 L66 83"/><path d="M101 70 L89 84"/><path d="M126 67 L113 84"/><path d="M151 63 L137 84"/><path d="M176 60 L161 84"/><path d="M201 56 L185 84"/><path d="M226 53 L209 84"/><path d="M251 50 L233 84"/><path d="M276 46 L257 84"/><path d="M301 43 L281 84"/><path d="M326 39 L305 84"/><path d="M351 36 L329 84"/><path d="M376 33 L353 84"/><path d="M401 29 L377 84"/><path d="M426 26 L401 84"/><path d="M451 22 L425 84"/></g></g></svg>
    </a>
    <button class="menubtn" id="closeMenu">닫기</button>
  </div>
  <nav id="nav">
    <a href="#/issues" data-k="issues">발행호</a>
    <span id="categoryNav" style="display:contents"></span>
    <a href="#/writers" data-k="writers">필진</a>
    <a href="#/about" data-k="about">소개</a>
  </nav>

<main id="app"></main>

<footer><div class="bar"><span>비평웹진 공통감 · 씨네꼼</span><span>자체 웹사이트 시안</span></div></footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import Quill from "https://cdn.jsdelivr.net/npm/quill@2.0.3/+esm";
import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3/+esm";

const SUPABASE_URL = "https://abkboomskewfvadkaapc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_I_mGGqncIBxDLz6ggAbihQ_YQg7rCCB";
const EDITOR_EMAIL = "cinecom1993@proton.me";
const IMAGE_BUCKET = "article-images";
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
});

const MENU_CATEGORY_IDS = ["criticism","essay","program"];
const CATEGORY_DESCRIPTIONS = {
  criticism:"필진 연재 비평과 상영작 리뷰",
  essay:"영화를 둘러싼 산문",
  program:"상영 프로그램과 기획 소개"
};
const DEFAULT_WRITERS = [
  ["필진 A","영화 비평 · 연재"], ["필진 B","에세이"],
  ["필진 C","영화 비평"], ["필진 D","영화 비평 · 사운드"],
  ["필진 E","에세이 · 리뷰"], ["필진 F","영화 비평 · 연재"]
];
const LOREM = ["아직 본문이 입력되지 않았다."];

let CATS = {}, WRITERS = [], ISSUES = [], POSTS = [], EDITOR_USER = null;
const esc = value => String(value ?? "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));
const W = id => WRITERS.find(w => String(w.id) === String(id));
const initial = w => (w.initials || w.name || "?").trim().slice(0,1);
const issueName = i => i?.title || "발행호 미지정";
const formatDate = value => value ? new Date(value).toLocaleDateString("ko-KR", {year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\. /g,".").replace(/\.$/,"") : "";
const editorLoggedIn = () => Boolean(EDITOR_USER && EDITOR_USER.email?.toLowerCase() === EDITOR_EMAIL.toLowerCase());
const slugify = text => String(text).trim().toLowerCase().replace(/[^a-z0-9가-힣]+/g,"-").replace(/^-|-$/g,"").slice(0,70) || "post";
const showError = error => error?.message || "요청을 처리하지 못했습니다.";
const looksLikeHtml = value => /<\/?[a-z][\s\S]*>/i.test(String(value||""));
const plainTextToHtml = value => String(value||"").split(/\n\s*\n/).filter(Boolean).map(part=>`<p>${esc(part).replace(/\n/g,"<br>")}</p>`).join("");
const sanitizeBody = value => DOMPurify.sanitize(String(value||""),{
  ALLOWED_TAGS:["p","br","h2","h3","strong","b","em","i","u","s","blockquote","ul","ol","li","a","img","span","sub","sup"],
  ALLOWED_ATTR:["href","target","rel","src","alt","title","class"]
});
const storedBodyHtml = value => sanitizeBody(looksLikeHtml(value)?value:plainTextToHtml(value));

function mapData(authors,categories,issues,posts,images){
  CATS={}; categories.forEach(c=>CATS[c.slug]={id:c.id,ko:c.name,desc:CATEGORY_DESCRIPTIONS[c.slug]||""});
  WRITERS=authors.map(a=>({id:a.id,name:a.name,initials:a.initials||"",field:a.specialties||"",bio:a.bio||"",sort:a.sort_order||0}));
  ISSUES=issues.map(i=>({id:String(i.id),dbid:i.id,title:i.title,slug:i.slug,description:i.description||"",published_at:i.published_at,is_current:i.is_current}));
  const categoryById=Object.fromEntries(categories.map(c=>[String(c.id),c.slug]));
  const grouped={}; images.forEach(img=>(grouped[String(img.post_id)]||=[]).push(img));
  POSTS=posts.map(p=>{
    const records=(grouped[String(p.id)]||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    return {id:p.id,title:p.title,slug:p.slug,sub:p.excerpt||"",body:p.content||"",w:p.author_id,
      cat:categoryById[String(p.category_id)]||"",issue:String(p.issue_id||""),date:formatDate(p.published_at),
      published_at:p.published_at,image:p.cover_image_url||"",images:records.map(x=>x.public_url),imageRecords:records,
      status:p.status,created_at:p.created_at};
  });
}

async function loadData(){
  const queries=[
    db.from("authors").select("*").order("sort_order").order("name"),
    db.from("categories").select("*").order("sort_order").order("name"),
    db.from("issues").select("*").order("published_at",{ascending:false,nullsFirst:false}).order("created_at",{ascending:false}),
    db.from("posts").select("*").order("published_at",{ascending:false,nullsFirst:false}).order("created_at",{ascending:false}),
    db.from("post_images").select("*").order("sort_order")
  ];
  const results=await Promise.all(queries);
  const failed=results.find(r=>r.error); if(failed) throw failed.error;
  mapData(...results.map(r=>r.data||[])); renderCategoryNav();
}

async function seedWriters(){
  if(WRITERS.length || !editorLoggedIn()) return;
  const rows=DEFAULT_WRITERS.map(([name,specialties],i)=>({name,initials:name.slice(-1),specialties,bio:"필진 소개를 입력하세요.",sort_order:i+1}));
  const {error}=await db.from("authors").insert(rows); if(error) throw error;
  await loadData();
}

async function prepareImage(file){
  if(!file.type.startsWith("image/"))throw new Error("이미지 파일만 올릴 수 있습니다.");
  if(file.size>20*1024*1024)throw new Error(`${file.name}: 20MB 이하의 이미지를 선택하세요.`);
  const extensions={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"};
  const extension=extensions[file.type];
  if(!extension)throw new Error(`${file.name}: JPG, PNG, WebP, GIF 파일만 올릴 수 있습니다.`);
  return {body:file,extension,contentType:file.type};
}
async function uploadInlineImage(file){
  const original=await prepareImage(file);
  const path=`inline/${EDITOR_USER.id}/${Date.now()}-${crypto.randomUUID()}.${original.extension}`;
  const {error}=await db.storage.from(IMAGE_BUCKET).upload(path,original.body,{contentType:original.contentType,upsert:false});
  if(error)throw error;
  return db.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}
function selectInlineImage(quill,form){
  const input=document.createElement("input");
  input.type="file";input.accept="image/*";
  input.onchange=async()=>{
    const file=input.files?.[0];if(!file)return;
    const status=form.querySelector(".status"),wrap=form.querySelector(".quill-wrap"),submit=form.querySelector('button[type="submit"]');
    status.textContent="본문 이미지를 업로드하고 있습니다…";wrap.classList.add("editor-uploading");submit.disabled=true;
    try{
      const url=await uploadInlineImage(file),range=quill.getSelection(true)||{index:quill.getLength()-1};
      quill.insertEmbed(range.index,"image",url,"user");
      quill.setSelection(range.index+1,0,"silent");status.textContent="본문 이미지를 삽입했습니다.";
    }catch(error){status.textContent=showError(error);}
    finally{wrap.classList.remove("editor-uploading");submit.disabled=false;}
  };
  input.click();
}
async function uploadImages(postId,files,startOrder){
  const rows=[];
  for(let i=0;i<files.length;i++){
    const original=await prepareImage(files[i]),path=`${postId}/${Date.now()}-${i}-${crypto.randomUUID()}.${original.extension}`;
    const {error}=await db.storage.from(IMAGE_BUCKET).upload(path,original.body,{contentType:original.contentType,upsert:false});if(error)throw error;
    const {data}=db.storage.from(IMAGE_BUCKET).getPublicUrl(path);
    rows.push({post_id:postId,file_path:path,public_url:data.publicUrl,alt_text:files[i].name,sort_order:startOrder+i});
  }
  if(rows.length){const {error}=await db.from("post_images").insert(rows);if(error){await db.storage.from(IMAGE_BUCKET).remove(rows.map(x=>x.file_path));throw error;}}
  return rows;
}

  const form=document.getElementById("postForm");
  if(form){
   const quill=new Quill("#articleEditor",{
    theme:"snow",
    placeholder:"본문을 입력하세요.",
    modules:{toolbar:[
      [{header:[2,3,false]}],
      ["bold","italic","underline","strike"],
      ["blockquote"],
      [{list:"ordered"},{list:"bullet"}],
      [{align:[]}],
      ["link","image"],
      ["clean"]
    ]}
  });

let masonryFrame=0;
function layoutMasonry(){
  document.querySelectorAll(".tiles").forEach(grid=>{
    grid.classList.add("masonry");
    const rowHeight=parseFloat(getComputedStyle(grid).gridAutoRows)||8;
    const items=grid.querySelectorAll(":scope > .tile");
    items.forEach(item=>item.style.gridRowEnd="span 1");
    void grid.offsetWidth;
    items.forEach(item=>{
      const span=Math.max(1,Math.ceil((item.getBoundingClientRect().height+28)/rowHeight));
      item.style.gridRowEnd=`span ${span}`;
    });
  });
}
function scheduleMasonry(){
  cancelAnimationFrame(masonryFrame);
  masonryFrame=requestAnimationFrame(()=>requestAnimationFrame(layoutMasonry));
}
function setupMasonry(){
  document.querySelectorAll(".tiles img").forEach(img=>{
    if(!img.complete){img.addEventListener("load",scheduleMasonry,{once:true});img.addEventListener("error",scheduleMasonry,{once:true});}
  });
  if(document.fonts)document.fonts.ready.then(scheduleMasonry);
  scheduleMasonry();
}

/* 대표 이미지 자리: 흑백 도형으로 만든 임시 이미지. 실제 사진이 생기면 이 자리를 바꾼다 */
function art(seed, w=400, h=300){
  const r = (n)=>{ seed = (seed*9301+49297)%233280; return seed/233280*n; };
  const kind = Math.floor(r(6));
  const inv = r(1) < .35;
  const fg = inv ? "#fff" : "#000", bg = inv ? "#000" : "#fff";
  let g = "";
  if(kind===0){ for(let i=1;i<9;i++) g+=`<circle cx="${w*(.3+r(.4))|0}" cy="${h/2}" r="${i*22}" fill="none" stroke="${fg}" stroke-width="${1+r(3)}"/>`; }
  else if(kind===1){ let y=0; while(y<h){ const t=6+r(26); g+=`<rect x="0" y="${y}" width="${w}" height="${t*.55}" fill="${fg}"/>`; y+=t; } }
  else if(kind===2){ for(let i=-h;i<w;i+=14+r(10)) g+=`<line x1="${i}" y1="0" x2="${i+h}" y2="${h}" stroke="${fg}" stroke-width="${1+r(5)}"/>`; }
  else if(kind===3){ const s=18+r(14); for(let x=s/2;x<w;x+=s) for(let y=s/2;y<h;y+=s) g+=`<circle cx="${x}" cy="${y}" r="${1+r(s/3)}" fill="${fg}"/>`; }
  else if(kind===4){ g+=`<circle cx="${w*(.25+r(.5))}" cy="${h*(.6+r(.4))}" r="${h*(.45+r(.3))}" fill="${fg}"/><rect x="0" y="${h*(.15+r(.2))}" width="${w}" height="1.5" fill="${fg}"/>`; }
  else { let x=0; while(x<w){ const t=4+r(40); g+=`<rect x="${x}" y="0" width="${t*.5}" height="${h}" fill="${fg}"/>`; x+=t; } }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${w}" height="${h}" fill="${bg}"/>${g}</svg>`;
}

function prepareImage(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith("image/")){reject(new Error("이미지 파일만 올릴 수 있습니다."));return;}
    if(file.size>20*1024*1024){reject(new Error(`${file.name}: 20MB 이하의 이미지를 선택하세요.`));return;}
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error(`${file.name}: 파일을 읽지 못했습니다.`));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error(`${file.name}: 이미지를 처리하지 못했습니다.`));
      img.onload=()=>{
        const max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/webp",.78));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function bindEditor(){
  const login=document.getElementById("loginForm");
  if(login) login.onsubmit=e=>{
    e.preventDefault(); const f=new FormData(login), status=login.querySelector(".status");
    if(f.get("password")!=="legacy-password-removed"){status.textContent="비밀번호가 올바르지 않습니다.";return;}
    sessionStorage.setItem(EDITOR_SESSION_KEY,"yes"); route();
  };
  if(!editorLoggedIn()) return;
  document.getElementById("logoutBtn").onclick=()=>{sessionStorage.removeItem(EDITOR_SESSION_KEY);route();};
  document.getElementById("postForm").onsubmit=async e=>{
    e.preventDefault(); const form=e.currentTarget,f=new FormData(form),existing=POSTS.find(p=>String(p.id)===form.dataset.id);
    const status=form.querySelector(".status"),submit=form.querySelector('button[type="submit"]');
    const removed=new Set(f.getAll("removeImage").map(Number));
    const kept=(Array.isArray(existing?.images)?existing.images:[]).filter((_,i)=>!removed.has(i));
    const files=Array.from(form.elements.images.files||[]);
    let added=[];
    if(files.length){
      status.textContent=`이미지 ${files.length}개를 처리하고 있습니다…`; submit.disabled=true;
      try{ added=await Promise.all(files.map(prepareImage)); }
      catch(err){status.textContent=err.message;submit.disabled=false;return;}
    }
    const next={id:existing?existing.id:Math.max(0,...POSTS.map(p=>Number(p.id)||0))+1,title:f.get("title").trim(),sub:f.get("sub").trim(),body:f.get("body").trim(),w:f.get("writer"),cat:f.get("category"),issue:f.get("issue"),date:f.get("date").trim(),image:f.get("image").trim(),images:[...kept,...added],seed:existing?.seed||Date.now()%100000};
    if(existing) Object.assign(existing,next); else POSTS.unshift(next);
    if(!saveContent(existing?"글을 수정했습니다.":"글을 게시했습니다.")){submit.disabled=false;return;}
    location.hash="#/editor"; if(!existing) route();
  };
  document.querySelectorAll(".delete-post").forEach(btn=>btn.onclick=()=>{
    if(!confirm("이 글을 삭제할까요?")) return;
    POSTS=POSTS.filter(p=>String(p.id)!==btn.dataset.id); saveContent("글을 삭제했습니다."); route();
  });
  document.querySelectorAll(".writer-form").forEach(form=>form.onsubmit=e=>{
    e.preventDefault(); const f=new FormData(form),w=W(form.dataset.id); Object.assign(w,{name:f.get("name").trim(),field:f.get("field").trim(),bio:f.get("bio").trim()}); saveContent("필진 정보를 저장했습니다."); route();
  });
  document.getElementById("writerAddForm").onsubmit=e=>{
    e.preventDefault(); const f=new FormData(e.currentTarget); WRITERS.push({id:`writer-${Date.now()}`,name:f.get("name").trim(),field:f.get("field").trim(),bio:f.get("bio").trim()}); saveContent("필진을 추가했습니다."); route();
  };
  document.querySelectorAll(".category-form").forEach(form=>form.onsubmit=e=>{
    e.preventDefault(); const f=new FormData(form); CATS[form.dataset.id]={ko:f.get("name").trim(),desc:f.get("desc").trim()}; saveContent("카테고리를 저장했습니다."); route();
  });
  document.getElementById("categoryAddForm").onsubmit=e=>{
    e.preventDefault(); const f=new FormData(e.currentTarget),id=f.get("id").trim(); if(CATS[id]){alert("이미 사용 중인 주소입니다.");return;} CATS[id]={ko:f.get("name").trim(),desc:f.get("desc").trim()}; saveContent("카테고리를 추가했습니다."); route();
  };
  document.getElementById("issueAddForm").onsubmit=e=>{
    e.preventDefault(); const f=new FormData(e.currentTarget),year=Number(f.get("year")),month=Number(f.get("month")),id=`${year}-${String(month).padStart(2,"0")}`; if(ISSUES.some(i=>i.id===id)){alert("이미 등록된 발행호입니다.");return;} ISSUES.unshift({id,year,month,vol:Number(f.get("vol"))}); saveContent("발행호를 추가했습니다."); route();
  };
  document.getElementById("exportBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"}),a=document.createElement("a"); a.href=URL.createObjectURL(blob);a.download="gongtonggam-content.json";a.click();URL.revokeObjectURL(a.href);
  };
}
function notFound(){ return `<p>찾는 페이지가 없다. <a href="#/" style="border-bottom:1px solid">처음으로 가기</a></p>`; }

/* menu */
const menu=document.getElementById("menu"), openBtn=document.getElementById("openMenu");
let armed=true; // proximity trigger re-arms only after the pointer leaves the zone
function setMenu(on){
  menu.classList.toggle("open",on);
  openBtn.setAttribute("aria-expanded",on);
  document.body.style.overflow=on?"hidden":"";
  if(on) document.getElementById("closeMenu").focus({preventScroll:true});
}
openBtn.onclick=()=>setMenu(true);
document.getElementById("closeMenu").onclick=()=>{armed=false;setMenu(false);openBtn.focus({preventScroll:true});};
menu.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{ if(a.getAttribute("href")===location.hash) setMenu(false); }));
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&menu.classList.contains("open")){armed=false;setMenu(false);openBtn.focus({preventScroll:true});} });

/* 첫 화면: 메뉴 버튼 주위로 포인터를 가져가기만 해도 메뉴가 열린다 */
const RADIUS=130;
function nearMenu(x,y){
  const r=openBtn.getBoundingClientRect();
  const dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom);
  return Math.hypot(dx,dy)<RADIUS;
}
function proximity(x,y){
  if(!document.body.classList.contains("home")||menu.classList.contains("open")) return;
  const near=nearMenu(x,y);
  if(!near){armed=true;return;}
  if(armed){armed=false;setMenu(true);}
}
document.addEventListener("pointermove",e=>proximity(e.clientX,e.clientY));
document.addEventListener("touchmove",e=>{const t=e.touches[0]; if(t) proximity(t.clientX,t.clientY);},{passive:true});

function route(){
  const parts=(location.hash.replace(/^#\/?/,"")||"").split("/");
  const app=document.getElementById("app");
  let active="";
  if(!parts[0]) app.innerHTML="";
  else if(parts[0]==="issues"){active="issues";app.innerHTML=issues();}
  else if(parts[0]==="issue"){active="issues";app.innerHTML=issue(parts[1]);}
  else if(parts[0]==="archive"){active=parts[1];app.innerHTML=archive(active);}
  else if(parts[0]==="writers"){active="writers";app.innerHTML=writers();}
  else if(parts[0]==="writer"){active="writers";app.innerHTML=writer(parts[1]);}
  else if(parts[0]==="post"){const p=POSTS.find(x=>x.id==parts[1]);active=p?p.cat:"";app.innerHTML=post(parts[1]);}
  else if(parts[0]==="about"){active="about";app.innerHTML=about();}
  else if(parts[0]==="editor"){active="editor";app.innerHTML=editor(parts[1]==="post"?parts[2]:null);}
  else app.innerHTML=notFound();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===active));
  const isHome=!parts[0];
  document.body.classList.toggle("home",isHome);
  document.querySelector("header").classList.toggle("bare",isHome);
  setMenu(false);
  window.scrollTo(0,0);
  if(parts[0]==="editor") bindEditor();
}
window.addEventListener("hashchange",route);
renderCategoryNav();
route();
</script>
